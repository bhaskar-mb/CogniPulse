name: Deploy to Production

on:
  workflow_dispatch:

env:
  INFISICAL_ENVIRONMENT: prod
  INFISICAL_SECRET_PATH: /

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SPANDAN_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SPANDAN_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_ed25519 spandan-deploy@${{ secrets.SPANDAN_HOST }} bash << 'DEPLOY'
            set -e

            cd /var/samagama/cognipulse-workspace/cognipulse

            echo "==> Pulling latest code..."
            git pull origin main

            echo "==> Authenticating with Infisical..."

            export INFISICAL_TOKEN=$(npx @infisical/cli@0.43.40 login \
              --method=universal-auth \
              --client-id="${{ secrets.INFISICAL_CLIENT_ID }}" \
              --client-secret="${{ secrets.INFISICAL_CLIENT_SECRET }}" \
              --silent \
              --plain)

            if [ -z "$INFISICAL_TOKEN" ]; then
              echo "Infisical authentication failed"
              exit 1
            fi

            echo "==> Writing frontend .env from Infisical..."

            npx @infisical/cli@0.43.40 export \
              --token="$INFISICAL_TOKEN" \
              --projectId="${{ secrets.INFISICAL_PROJECT_ID }}" \
              --env="${{ env.INFISICAL_ENVIRONMENT }}" \
              --path="${{ env.INFISICAL_SECRET_PATH }}" \
              --format=dotenv \
              | grep "^VITE_" > frontend/.env


            echo "==> Writing backend .env from Infisical..."

            npx @infisical/cli@0.43.40 export \
              --token="$INFISICAL_TOKEN" \
              --projectId="${{ secrets.INFISICAL_PROJECT_ID }}" \
              --env="${{ env.INFISICAL_ENVIRONMENT }}" \
              --path="${{ env.INFISICAL_SECRET_PATH }}" \
              --format=dotenv \
              | grep -v "^VITE_" > backend/.env


            echo "==> Cleaning quotes from env files..."

            sed -i "s/='\(.*\)'/=\1/; s/=\"\(.*\)\"/=\1/" frontend/.env backend/.env


            echo "==> Installing frontend dependencies..."
            cd frontend
            npm install

            echo "==> Building frontend..."
            npm run build

            cd ..

            echo "==> Installing backend dependencies (workspace)..."
            npm install --workspace=backend

            echo "==> Restarting backend..."
            sudo systemctl restart cognipulse-backend.service || sudo systemctl restart spandan-backend.service

            echo "==> Restarting transcription service (faster-whisper)..."
            # Guarded so the deploy doesn't fail before the unit is installed on the server.
            # One-time setup: see backend/cognipulse-transcription.service (install deps + unit).
            sudo systemctl restart cognipulse-transcription.service || sudo systemctl restart spandan-transcription.service || echo "WARN: transcription service not installed yet"

            echo "==> Restarting question-generation worker (only used when Redis is enabled)..."
            # Guarded — only relevant when async generation (Redis) is set up; see backend/cognipulse-worker.service.
            sudo systemctl restart cognipulse-worker.service || sudo systemctl restart spandan-worker.service || echo "WARN: worker service not installed"

            echo "==> Restarting cognipulse service..."
            sudo systemctl restart cognipulse.service || sudo systemctl restart spandan.service || true

            echo "==> Reloading nginx..."
            sudo systemctl reload nginx

            echo "==> Deployment complete."

          DEPLOY
