server {
    server_name cognipulse.fun www.cognipulse.fun;
    root /var/www/cognipulse.fun;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /dummy/ {
        alias /var/www/cognipulse.fun/dummy/;
        index index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/cognipulse.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cognipulse.fun/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.cognipulse.fun) {
        return 301 https://$host$request_uri;
    }
    if ($host = cognipulse.fun) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name cognipulse.fun www.cognipulse.fun;
    return 404;
}